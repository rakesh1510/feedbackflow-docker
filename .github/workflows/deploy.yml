
name: Deploy FeedbackFlow Docker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 187.77.184.173
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/html/feedbackflow_Docker
            git pull origin main
            docker compose down
            docker compose up -d --build
            docker ps
